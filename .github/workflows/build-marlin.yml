name: Build Marlin for SKR Mini E3 V2 - Ender 5 Pro
on:
  push:
    branches: [ "marlin-skr-mini-e3-v2-ender5pro" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout Marlin (bugfix-2.1.x)
        uses: actions/checkout@v4
        with:
          repository: MarlinFirmware/Marlin
          ref: bugfix-2.1.x
          path: Marlin

      - name: Copy config files into Marlin
        run: |
          mkdir -p Marlin/Marlin
          cp -v .github/marlin-config/Configuration.h Marlin/Marlin/Configuration.h
          cp -v .github/marlin-config/Configuration_adv.h Marlin/Marlin/Configuration_adv.h

      - name: Show head of Configuration.h
        run: sed -n '1,120p' Marlin/Marlin/Configuration.h || true

      - name: Set up Python/PlatformIO
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          platformio --version

      - name: Build Marlin for SKR Mini E3 V2 (STM32F103RC_btt)
        working-directory: Marlin
        run: |
          platformio run -e STM32F103RC_btt -v

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marlin-firmware-binary
          path: |
            Marlin/.pio/build/STM32F103RC_btt/firmware.bin
